version: "3.8"

services:
  # ── Next.js app ──────────────────────────────────────────────────────────────
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gatekeeper
    networks:
      - gate
    depends_on:
      db:
        condition: service_healthy

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gatekeeper
    ports:
      - "5432:5432"
    networks:
      - gate
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gatekeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  gate:
    driver: bridge

volumes:
  postgres-data:
