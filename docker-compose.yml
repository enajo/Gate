services:
  db:
    image: postgres:16-alpine
    container_name: gate_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gatekeeper
    ports:
      - "5432:5432"
    volumes:
      - gate_db_data:/var/lib/postgresql/data

volumes:
  gate_db_data:
