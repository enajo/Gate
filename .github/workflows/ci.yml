name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Lint · Audit · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gatekeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Dummy values — same minimum set tests/setup.ts uses to let server
      # modules import cleanly. No real secret is ever needed for a build:
      # `prisma generate` only reads the schema, and `next build`'s static
      # generation just needs lib/env.ts's required fields to validate.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/gatekeeper
      AUTH_SECRET: ci-build-dummy-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan all commits on a PR
          fetch-depth: 0

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        # npm run typecheck (not raw tsc) so CI runs `next typegen` first,
        # same as local — otherwise CI can silently miss route-type errors
        # a local typecheck would catch.
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Audit dependencies
        # Blocks on critical CVEs. `npm audit` calls out to npm's live
        # advisory API — a transient timeout/error there fails this step
        # with no real vulnerability behind it (reproduced locally: two
        # real CI failures on this exact step, a from-scratch `npm ci` +
        # audit reproduced neither). Retry a few times before treating a
        # failure as real.
        run: |
          for attempt in 1 2 3; do
            if npm audit --audit-level=critical; then
              exit 0
            fi
            echo "npm audit attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "npm audit failed after 3 attempts."
          exit 1

      - name: Test with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Production build
        # Compiling clean is not the same as building for production —
        # this step exists because that gap repeatedly caught real bugs
        # (see docs/decisions/) that typecheck/lint/test all missed.
        run: npm run build
