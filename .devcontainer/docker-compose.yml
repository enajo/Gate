version: "3.8"

services:
  # ── Next.js app ──────────────────────────────────────────────────────────────
  app:
    image: mcr.microsoft.com/devcontainers/base:ubuntu
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity      # keeps the container alive; VS Code attaches here
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/gatekeeper
    depends_on:
      db:
        condition: service_healthy
    network_mode: service:db    # share network so localhost:5432 works inside the app

  # ── PostgreSQL ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gatekeeper
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gatekeeper"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
